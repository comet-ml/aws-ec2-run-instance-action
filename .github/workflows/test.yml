name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  id-token: write
  contents: write

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          npm install
      - run: |
          npm run all
  test: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: "${{ secrets.AWS_ASSUME_ROLE }}"
          aws-region: "us-east-2"
      - name: Generate SSH Key
        id: ssh-key
        uses: truemark/generate-ssh-key-action@195c7260204d0762c21931c98768d59df44aebd7 # v2
      - name: Setup instance
        id: instance
        uses: ./
        with:
          security-group-id: "${{ vars.SECURITY_GROUP_ID }}"
          subnet-id: "${{ vars.SUBNET_ID }}"
          instance-profile: "${{ vars.INSTANCE_PROFILE }}"
          region: "us-east-2"
          image-id: "default-arm64"
          instance-type: "c7g.large"
          user-data: |
            #!/usr/bin/env bash
            mkdir -p /home/ec2-user/.ssh
            touch /home/ec2-user/.ssh/authorized_keys
            chmod 700 /home/ec2-user/.ssh
            chmod 600 /home/ec2-user/.ssh/authorized_keys
            echo "${{ steps.ssh-key.outputs.public-key }}" >> /home/ec2-user/.ssh/authorized_keys
      - name: Wait for instances
        id: ec2-wait
        uses: truemark/aws-ec2-instance-wait-action@63e4f491e422280589aec3e1ff1f16eafb684afe # v3
        with:
          instance-ids: ${{ steps.instance.outputs.instance-id }}
          region: "us-east-2"
          timeout-ms: "600000"
      - name: Describe Instance
        id: describe-instance
        uses: truemark/aws-ec2-describe-instance-action@ec85f05098d77efc25df32d79b262cb897da7afc # v2
        with:
          instance-id: ${{ steps.instance.outputs.instance-id }}
          region: "us-east-2"
      - name: SSH Known Hosts
        id: ssh-known-hosts
        uses: truemark/ssh-known-hosts-action@4915808ab9ba91a3924f61d455ce1d487f0a722a # v1
        with:
          scan-hosts: ${{ steps.describe-instance.outputs.public-dns-name }}
      - name: Validate
        run: ssh ec2-user@${{ steps.describe-instance.outputs.public-dns-name }} "cat /etc/amazon-linux-release"
